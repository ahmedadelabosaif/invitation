<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>You’re invited</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#eef1f5;--ink:#1f2a44;--surface:#fff;--line:#d5dbe6;--muted:#5c6780;--accent:#b4476b;--onacc:#fff;box-sizing:border-box;color-scheme:light}
    @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121826;--ink:#eaeeff;--surface:#1b2438;--line:#2c3750;--muted:#9aa6c0;--accent:#e58aa9;--onacc:#121826;color-scheme:dark}}
    :root[data-theme=dark]{--bg:#121826;--ink:#eaeeff;--surface:#1b2438;--line:#2c3750;--muted:#9aa6c0;--accent:#e58aa9;--onacc:#121826;color-scheme:dark}
    *,*::before,*::after{box-sizing:border-box}
    [hidden]{display:none!important}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Karla,system-ui,sans-serif}
    #pageBackdrop{position:fixed;inset:-3%;z-index:0;background-position:center;background-size:cover;pointer-events:none;animation:backdrop-drift 32s ease-in-out infinite alternate}
    #stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px}
    #notice{width:100%;max-width:560px;margin:0 0 12px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--muted)}
    .card{position:relative;overflow:hidden;width:100%;max-width:560px;border-radius:20px;padding:48px 28px 40px;text-align:center;background:var(--cbg);color:var(--cink);box-shadow:0 12px 40px rgba(0,0,0,.18)}
    .card::before{content:"";position:absolute;inset:10px;border:1px solid var(--cacc);border-radius:14px;opacity:.5;pointer-events:none}
    .decor{position:absolute;inset:0;pointer-events:none}
    .decor span{position:absolute;opacity:0;line-height:1}
    .decor.fall span{top:-8%;animation:fall linear infinite}
    .decor.rise span{bottom:-8%;animation:rise linear infinite}
    .decor.twinkle span{animation:twinkle ease-in-out infinite}
    .card{animation:card-arrive .9s cubic-bezier(.2,.75,.3,1) both}
    .icon:not(:empty){animation:icon-float 4s ease-in-out infinite}
    @keyframes card-arrive{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes backdrop-drift{from{transform:scale(1)}to{transform:scale(1.06)}}
    @keyframes icon-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}10%,90%{opacity:.85}100%{transform:translate(36px,640px) rotate(160deg);opacity:0}}
    @keyframes rise{0%{transform:translate(0,0);opacity:0}10%,90%{opacity:.85}100%{transform:translate(24px,-640px);opacity:0}}
    @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
    .inner{position:relative}
    .icon{font-size:2.2rem}
    .card p:empty,.icon:empty{display:none}
    .kicker{margin:6px 0 4px;color:var(--cmut);font:italic 1.35rem "Cormorant Garamond",Georgia,serif}
    .card h1{margin:0 0 20px;font:500 clamp(2.6rem,10vw,4rem)/1.05 "Cormorant Garamond",Georgia,serif}
    .date{margin:0;font:600 1.6rem "Cormorant Garamond",Georgia,serif}
    .time{margin:2px 0 0;color:var(--cmut)}
    .venue{margin:14px 0 0;font-weight:600}
    .location-link{display:inline-block;margin-top:8px;padding:7px 14px;border:1px solid var(--cacc);border-radius:999px;color:var(--cink);font-size:.92rem;text-decoration:none;transition:background .2s ease,transform .2s ease}
    .location-link:hover{background:var(--cacc);color:var(--cbg);transform:translateY(-2px)}
    .msg{max-width:38ch;margin:20px auto 0;color:var(--cmut)}
    .info{max-width:40ch;margin:22px auto 0;padding-top:16px;border-top:1px solid var(--cacc);font-size:.95rem;white-space:pre-line}
    .etiquette{display:grid;gap:6px;max-width:40ch;margin:18px auto 0}
    .etiquette-note{margin:0;padding:7px 10px;border:1px solid color-mix(in srgb,var(--cacc) 50%,transparent);border-radius:8px;font-size:.92rem}
    .clock{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:360px;margin:28px auto 8px}
    .clock b{display:block;color:var(--cacc);font:500 2.4rem/1.1 "Cormorant Garamond",Georgia,serif;font-variant-numeric:tabular-nums}
    .clock span{color:var(--cmut);font-size:.85rem}
    .done{margin:28px 0 8px;font:italic 1.35rem "Cormorant Garamond",Georgia,serif}
    .btn{display:inline-block;margin-top:18px;padding:11px 22px;border-radius:999px;background:var(--cacc);color:var(--cbg);font-weight:600;text-decoration:none}
    .btn:hover{filter:brightness(1.08)}
    .card :focus-visible{outline:2px solid var(--cacc);outline-offset:2px}
    .more{display:grid;gap:8px;width:100%;max-width:560px;margin-top:24px}
    .more h2{margin:0;font:600 1.4rem "Cormorant Garamond",Georgia,serif}
    .mrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none}
    .mrow:hover{border-color:var(--accent)}
    .mrow small{display:block;color:var(--muted)}
    .music-controls{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:2}
    .music-control{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);box-shadow:0 4px 16px rgba(0,0,0,.15);font:600 .9rem Karla,system-ui,sans-serif;cursor:pointer}
    .music-control:hover{border-color:var(--accent)}
    .music-control:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    #backgroundVideo{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:.01;pointer-events:none}
    @media(prefers-reduced-motion:reduce){.decor.fall,.decor.rise{display:none}.decor span{animation:none!important;opacity:.6}.card{animation:none}}
    @media(prefers-reduced-motion:reduce){#pageBackdrop,.icon:not(:empty){animation:none}}
    @media(max-width:480px){.music-controls{right:12px;bottom:max(12px,env(safe-area-inset-bottom))}.music-control{padding:8px 11px;font-size:.82rem}}
  </style>
</head>
<body>
  <div id="pageBackdrop" hidden aria-hidden="true"></div>
  <audio id="backgroundMusic" preload="none" loop hidden></audio>
  <main id="stage">
    <p id="notice" role="status" hidden></p>
    <article class="card" id="card">
      <div class="decor" id="decor" aria-hidden="true"></div>
      <div class="inner">
        <div class="icon" id="icon"></div>
        <p class="kicker" id="kicker"></p>
        <h1 id="names"></h1>
        <p class="date" id="date"></p>
        <p class="time" id="time"></p>
        <p class="venue" id="venue"></p>
        <a class="location-link" id="locationLink" hidden target="_blank" rel="noopener noreferrer">Get directions ↗</a>
        <p class="msg" id="msg"></p>
        <p class="info" id="info"></p>
        <section class="etiquette" id="etiquette" aria-label="Guest etiquette" hidden></section>
        <div id="clock" role="timer"></div>
        <a class="btn" id="cal" href="#" target="_blank" rel="noopener">Add to Google Calendar</a>
      </div>
    </article>
    <section class="more" id="more" hidden></section>
  </main>
  <div id="musicControls" class="music-controls" hidden>
    <button id="musicToggle" class="music-control" type="button" aria-pressed="false">♫ Play music</button>
  </div>
  <iframe id="backgroundVideo" title="Background music player" aria-hidden="true" tabindex="-1" hidden allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script src="./guest.js"></script>
</body>
</html>
