<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You’re invited</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style id="css">
:root{
  --bg:#EEF1F5;--ink:#1F2A44;--surface:#FFFFFF;--line:#D5DBE6;--muted:#5C6780;--accent:#B4476B;--onacc:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121826;--ink:#EAEEF7;--surface:#1B2438;--line:#2C3750;--muted:#9AA6C0;--accent:#E58AA9;--onacc:#121826;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#121826;--ink:#EAEEF7;--surface:#1B2438;--line:#2C3750;--muted:#9AA6C0;--accent:#E58AA9;--onacc:#121826;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Karla,system-ui,sans-serif;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
body.has-bar::before{background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{border-color:var(--accent);font-weight:600}
button.primary{background:var(--accent);color:var(--onacc);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
#bar .sp{flex:1}
#status{color:var(--muted);font-size:.9rem}
body.admin-edit #layout{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:24px;align-items:start;max-width:1120px;margin:0 auto;padding:20px 16px}
@media(max-width:820px){body.admin-edit #layout{grid-template-columns:1fr}}
#panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
#panel h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.5rem;margin:0}
#panel p{margin:0;color:var(--muted);font-size:.9rem}
#panel label{display:grid;gap:4px;font-size:.9rem;color:var(--muted)}
#panel input,#panel select,#panel textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;color:var(--ink)}
#panel textarea{min-height:84px;resize:vertical}
#elist{display:grid;gap:6px}
#elist button{text-align:left}
.row2{display:flex;gap:8px;flex-wrap:wrap}
#stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;padding:24px 16px}
body:not(.has-bar) #stage{min-height:100vh}
.more{width:100%;max-width:560px;margin-top:24px;display:grid;gap:8px}
.more h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.4rem;margin:0}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none}
.mrow:hover{border-color:var(--accent)}
.mrow small{display:block;color:var(--muted)}
.card{position:relative;overflow:hidden;width:100%;max-width:560px;border-radius:20px;padding:48px 28px 40px;text-align:center;background:var(--cbg);color:var(--cink);box-shadow:0 12px 40px rgba(0,0,0,.18)}
.card::before{content:"";position:absolute;inset:10px;border:1px solid var(--cacc);border-radius:14px;opacity:.5;pointer-events:none}
.decor{position:absolute;inset:0;pointer-events:none}
.decor span{position:absolute;opacity:0;line-height:1}
.decor.fall span{top:-8%;animation:fall linear infinite}
.decor.rise span{bottom:-8%;animation:rise linear infinite}
.decor.twinkle span{animation:twinkle ease-in-out infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0deg);opacity:0}10%{opacity:.85}90%{opacity:.85}100%{transform:translate(36px,640px) rotate(160deg);opacity:0}}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.85}90%{opacity:.85}100%{transform:translate(24px,-640px);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
.inner{position:relative}
.icon{font-size:2.2rem}
.card p:empty,.icon:empty{display:none}
.kicker{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1.35rem;margin:6px 0 4px;color:var(--cmut)}
.card h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(2.6rem,10vw,4rem);line-height:1.05;margin:0 0 20px}
.date{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:1.6rem;margin:0}
.time{margin:2px 0 0;color:var(--cmut)}
.venue{margin:14px 0 0;font-weight:600}
.msg{max-width:38ch;margin:20px auto 0;color:var(--cmut)}
.info{max-width:40ch;margin:22px auto 0;padding-top:16px;border-top:1px solid var(--cacc);font-size:.95rem;white-space:pre-line}
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:28px auto 8px;max-width:360px}
.clock b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:2.4rem;line-height:1.1;color:var(--cacc);font-variant-numeric:tabular-nums}
.clock span{font-size:.85rem;color:var(--cmut)}
.done{margin:28px 0 8px;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1.35rem}
.btn{display:inline-block;margin-top:18px;padding:11px 22px;border-radius:999px;background:var(--cacc);color:var(--cbg);font-weight:600;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.card :focus-visible{outline-color:var(--cacc)}
@media(prefers-reduced-motion:reduce){.decor.fall,.decor.rise{display:none}.decor span{animation:none!important;opacity:.6}}
</style>
</head>
<body>
<div id="root"></div>
<script type="application/json" id="data">{"featured":"wedding","events":[{"id":"wedding","emoji":"💍","kicker":"You’re invited to the wedding of","names":"Sara & Ahmed","event":"Sara & Ahmed’s wedding","date":"2027-06-12","time":"16:00","venue":"Venue name, City","message":"We would be honored to celebrate with you. Join us for dinner, music and dancing.","info":"Dress code: formal.\nParking is available at the venue.","env":"garden"}]}</script>
<script id="app">
(function(){
  var ENVS={
    classic:{n:'Classic',bg:'#FFFFFF',ink:'#1F2A44',mut:'#5C6780',acc:'#B4476B',m:'fall',e:['✨','🤍'],c:8},
    garden:{n:'Garden',bg:'#DDEBDD',ink:'#1E3A2A',mut:'#4F6B58',acc:'#3F7A55',m:'fall',e:['🌸','🍃','🌼'],c:10},
    beach:{n:'Beach',bg:'#D9EEF3',ink:'#123B4A',mut:'#3D6272',acc:'#1B7F9A',m:'rise',e:['🫧','🐚'],c:10},
    sunset:{n:'Sunset',bg:'#FBE3D6',ink:'#4A2335',mut:'#7A5260',acc:'#C2492F',m:'rise',e:['🎈','✨'],c:7},
    night:{n:'Night sky',bg:'#1A2142',ink:'#EEF0FF',mut:'#A9B1D6',acc:'#F2C46D',m:'twinkle',e:['✦','⭐','✧'],c:18}
  };
  var FIELDS=[['emoji','Emoji','text',4],['kicker','Intro line','text',80],['names','Names / title','text',80],['event','Calendar title','text',80],['date','Date','date'],['time','Time','time'],['venue','Venue','text',120],['message','Message','area',300],['info','Additional information','area',600]];
  var HEAD='<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>You’re invited</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;600&display=swap" rel="stylesheet">';
  function guestLink(id){return location.origin+location.pathname+'#'+id;}
  function $(id){return document.getElementById(id);}
  function pad(n){return String(n).padStart(2,'0');}
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}

  var draft=JSON.parse($('data').textContent), sel=null, admin=false, mode='guest', start=null, lastEnv=null, artifact=null, armed=false;
  function find(id){return draft.events.find(function(e){return e.id===id;});}
  function sorted(){return draft.events.slice().sort(function(a,b){return (a.date||'9').localeCompare(b.date||'9');});}
  function startOf(d){
    if(!d.date)return null;
    var p=d.date.split('-').map(Number), t=(d.time||'00:00').split(':').map(Number);
    return new Date(p[0],p[1]-1,p[2],t[0]||0,t[1]||0,0);
  }
  function stamp(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';}
  function longDate(s){return s.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});}

  $('root').innerHTML=
    '<div id="bar" hidden><strong>Admin</strong>'+
    '<button id="bEdit" aria-pressed="true">Edit</button><button id="bGuest" aria-pressed="false">Guest view</button>'+
    '<span class="sp"></span><span id="status"></span><button id="bSave" class="primary">Save changes</button></div>'+
    '<div id="layout"><div id="panel" hidden></div>'+
    '<main id="stage"><article class="card" id="card"><div class="decor" id="decor" aria-hidden="true"></div><div class="inner">'+
    '<div class="icon" id="icon"></div><p class="kicker" id="kicker"></p><h1 id="names"></h1>'+
    '<p class="date" id="date"></p><p class="time" id="time"></p><p class="venue" id="venue"></p><p class="msg" id="msg"></p><p class="info" id="info"></p>'+
    '<div id="clock" role="timer"></div><a class="btn" id="cal" href="#" target="_blank" rel="noopener">Add to Google Calendar</a>'+
    '</div></article><section class="more" id="more" hidden></section></main></div>';

  function buildDecor(env){
    var s='';
    for(var i=0;i<env.c;i++){
      var left=(i*97)%100, dur=9+(i*7)%8, delay=-((i*5)%dur), size=0.9+(i%4)*0.25, top=(i*37)%90, tw=env.m==='twinkle';
      s+='<span style="left:'+left+'%;'+(tw?'top:'+top+'%;':'')+'font-size:'+size+'rem;animation-duration:'+(tw?3+(i%4):dur)+'s;animation-delay:'+delay+'s">'+env.e[i%env.e.length]+'</span>';
    }
    var d=$('decor');d.className='decor '+env.m;d.innerHTML=s;
  }
  function applyCard(d){
    var key=d&&ENVS[d.env]?d.env:'classic', env=ENVS[key], card=$('card');
    d=d||{};
    card.style.setProperty('--cbg',env.bg);card.style.setProperty('--cink',env.ink);
    card.style.setProperty('--cmut',env.mut);card.style.setProperty('--cacc',env.acc);
    start=startOf(d);
    $('icon').textContent=d.emoji||'';
    $('kicker').textContent=d.kicker||'';
    $('names').textContent=d.names||(d.id?'':'No events yet');
    $('date').textContent=start?longDate(start):(d.id?'Date to be announced':'');
    $('time').textContent=(start&&d.time)?'at '+start.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'';
    $('venue').textContent=d.venue||'';
    $('msg').textContent=d.message||'';
    $('info').textContent=d.info||'';
    $('cal').hidden=!start;
    if(start){
      var end=new Date(start.getTime()+4*3600*1000);
      $('cal').href='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(d.event||d.names||'Event')+
        '&dates='+stamp(start)+'/'+stamp(end)+'&details='+encodeURIComponent(d.message||'')+'&location='+encodeURIComponent(d.venue||'');
    }
    if(key!==lastEnv){lastEnv=key;buildDecor(env);}
    tick();
  }
  function tick(){
    var c=$('clock');
    if(!start){c.innerHTML='';return;}
    var diff=start-Date.now();
    if(diff<=0){c.innerHTML='<p class="done">Thank you for celebrating with us.</p>';return;}
    var sec=Math.floor(diff/1000), d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600), m=Math.floor(sec%3600/60), x=sec%60;
    c.innerHTML='<div class="clock">'+[[d,'days'],[pad(h),'hours'],[pad(m),'minutes'],[pad(x),'seconds']].map(function(u){return '<div><b>'+u[0]+'</b><span>'+u[1]+'</span></div>';}).join('')+'</div>';
  }
  function pick(){
    var id=admin?sel:location.hash.slice(1);
    return find(id)||find(draft.featured)||sorted()[0]||null;
  }
  function renderMore(cur){
    var box=$('more');box.innerHTML='';
    var others=sorted().filter(function(e){return !cur||e.id!==cur.id;});
    box.hidden=!others.length;
    if(!others.length)return;
    box.appendChild(el('h2','','More events'));
    others.forEach(function(o){
      var a=el('a','mrow'), s=startOf(o), days=s?Math.ceil((s-Date.now())/864e5):null;
      a.href='#'+o.id;
      a.appendChild(el('span','',o.emoji||'✨'));
      var mid=el('span');mid.appendChild(el('b','',o.names||o.event||'Event'));mid.appendChild(el('small','',s?longDate(s):'Date to be announced'));
      a.appendChild(mid);
      a.appendChild(el('span','',days===null?'':days>0?'in '+days+' day'+(days===1?'':'s'):days===0?'today':Math.abs(days)+' days ago'));
      a.addEventListener('click',function(e){if(admin){e.preventDefault();sel=o.id;render();}else{window.scrollTo(0,0);}});
      box.appendChild(a);
    });
  }
  function render(){var ev=pick();applyCard(ev);renderMore(ev);}

  render();
  setInterval(tick,1000);
  window.addEventListener('hashchange',render);

  // ---- Admin ----
  function buildDoc(d){
    var json=JSON.stringify(d).replace(/</g,'\\u003c');
    return '<!doctype html>\n<html lang="en"><head>'+HEAD+'<style id="css">'+$('css').textContent+'</style></head><body><div id="root"></div>'+
      '<script type="application/json" id="data">'+json+'<'+'/script><script id="app">'+$('app').textContent+'<'+'/script></body></html>';
  }
  function status(t){$('status').textContent=t;}
  function setMode(m){
    mode=m;document.body.className='has-bar'+(m==='edit'?' admin-edit':'');
    $('panel').hidden=(m!=='edit');
    $('bEdit').setAttribute('aria-pressed',m==='edit');
    $('bGuest').setAttribute('aria-pressed',m!=='edit');
  }
  function renderList(){
    var box=$('elist');box.innerHTML='';
    sorted().forEach(function(e){
      var b=el('button','',(e.emoji||'✨')+' '+(e.names||e.event||'Untitled')+(e.id===draft.featured?'  ★':'')+(e.date?'  ·  '+e.date:''));
      b.setAttribute('aria-pressed',e.id===sel);
      b.addEventListener('click',function(){sel=e.id;fill();render();});
      box.appendChild(b);
    });
  }
  function fill(){
    var ev=find(sel);
    $('fields').hidden=!ev;
    if(ev){
      FIELDS.concat([['env']]).forEach(function(f){$('f_'+f[0]).value=ev[f[0]]||(f[0]==='env'?'classic':'');});
      $('f_link').value=guestLink(ev.id);
      $('bFeat').textContent=ev.id===draft.featured?'Featured on the main link':'Show on the main link';
    }
    armed=false;$('bDel').textContent='Delete event';
    renderList();
  }
  function enableAdmin(){
    admin=true;
    var h='<h2>Events</h2><div id="elist"></div><button id="bAdd">Add event</button><div id="fields" class="row2" style="display:grid;gap:12px"><h2>Edit event</h2>';
    FIELDS.forEach(function(f){
      h+='<label>'+f[1]+(f[2]==='area'?'<textarea id="f_'+f[0]+'" maxlength="'+f[3]+'"></textarea>':'<input id="f_'+f[0]+'" type="'+f[2]+'"'+(f[3]?' maxlength="'+f[3]+'"':'')+'>')+'</label>';
    });
    h+='<label>Environment<select id="f_env">'+Object.keys(ENVS).map(function(k){return '<option value="'+k+'">'+ENVS[k].n+'</option>';}).join('')+'</select></label>';
    h+='<div class="row2"><button id="bFeat"></button><button id="bDel">Delete event</button></div>';
    h+='<label>Public invitation link for this event<input id="f_link" readonly></label><button id="bCopy">Copy public link</button>';
    h+='<p>The main link shows the featured event. Set sharing to anyone with the link using the artifact’s Share button. Guests can view the invitation but cannot edit it.</p></div>';
    $('panel').innerHTML=h;
    var saved=null;try{saved=sessionStorage.getItem('sel');}catch(e){}
    sel=(saved&&find(saved)&&saved)||(find(draft.featured)?draft.featured:(draft.events[0]&&draft.events[0].id));
    FIELDS.concat([['env']]).forEach(function(f){
      var inp=$('f_'+f[0]);
      inp.addEventListener('input',function(){var ev=find(sel);if(!ev)return;ev[f[0]]=inp.value;render();renderList();status('Unsaved changes');});
    });
    $('bAdd').addEventListener('click',function(){
      var id='e'+Date.now().toString(36);
      draft.events.push({id:id,emoji:'🎉',kicker:'You’re invited to',names:'New event',event:'New event',date:'',time:'',venue:'',message:'',info:'',env:'classic'});
      sel=id;fill();render();status('Unsaved changes');
    });
    $('bFeat').addEventListener('click',function(){draft.featured=sel;fill();status('Unsaved changes');});
    $('bDel').addEventListener('click',function(){
      if(!armed){armed=true;$('bDel').textContent='Click again to delete';return;}
      draft.events=draft.events.filter(function(e){return e.id!==sel;});
      if(draft.featured===sel)draft.featured=draft.events[0]?draft.events[0].id:null;
      sel=draft.events[0]?draft.events[0].id:null;fill();render();status('Unsaved changes');
    });
    $('bCopy').addEventListener('click',function(){
      var i=$('f_link');
      function fail(){i.focus();i.select();status('Press Ctrl+C (or Cmd+C) to copy.');}
      try{navigator.clipboard.writeText(i.value).then(function(){status('Link copied.');},fail);}catch(e){fail();}
    });
    $('bar').hidden=false;
    $('bEdit').addEventListener('click',function(){setMode('edit');});
    $('bGuest').addEventListener('click',function(){setMode('guest');});
    $('bSave').addEventListener('click',save);
    setMode('edit');fill();render();
  }
  async function save(){
    var b=$('bSave');b.disabled=true;status('Saving…');
    try{sessionStorage.setItem('sel',sel||'');}catch(e){}
    try{await artifact.publish(buildDoc(draft));}
    catch(e){
      var c=e&&e.code;
      status(c==='not_writer'||c==='not_granted'?'You don’t have edit access.':c==='conflict'?'':c==='rate_limited'?'Too many saves. Wait a moment.':'Couldn’t save. Try again.');
      b.disabled=false;
    }
  }
  (async function(){
    try{
      if(!window.claude||!claude.use)return;
      var user=await claude.use('user');
      if(!user||!(await user.canEdit()))return;
      artifact=await claude.use('artifact');
      if(artifact)enableAdmin();
    }catch(e){}
  })();
})();
</script>
</body>
</html>
