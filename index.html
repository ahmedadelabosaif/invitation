<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf4">
  <title>دعوة زفاف</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#fbfaf4;--bg2:#fff;--ink:#2b3d22;--mute:#6b7a5f;--gold:#3d5a2e;--line:rgba(61,90,46,.3);--card:rgba(61,90,46,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
    *,*::before,*::after{box-sizing:border-box}
    [hidden],.hidden{display:none!important}
    html{scroll-padding-top:env(safe-area-inset-top,0px)}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 Tajawal,Tahoma,sans-serif;overflow-x:hidden}
    p{margin:.4em 0}
    section{max-width:560px;margin:0 auto;padding:64px 24px;text-align:center;border-bottom:1px solid var(--line)}
    h2{margin:0 0 14px;color:var(--gold);font:700 1.9rem "Aref Ruqaa",serif}
    .script,.hero .names,.wreath .names,.dateblock b,.verse,.cards .nm{font-family:"Aref Ruqaa","Amiri",serif}
    .mute{color:var(--mute)}
    .hero{position:relative;display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 20%,var(--bg2),var(--bg) 70%)}
    .hero .names{color:var(--ink);font-size:clamp(2.6rem,12vw,4.4rem);font-weight:700;line-height:1.35}
    .hero .amp{display:block;color:var(--gold);font-size:2rem}
    .date-big{margin-top:14px;color:var(--ink);font-size:1.7rem;font-weight:700;line-height:1.6;white-space:pre-line}
    .poem{position:relative;max-width:420px;margin:0 0 6px;font-size:1.12rem;line-height:2.1;white-space:pre-line}
    .wreath{position:relative;display:flex;width:min(330px,84vw);aspect-ratio:1;align-items:center;justify-content:center;margin:6px 0}
    .wreath svg{position:absolute;inset:0;width:100%;height:100%}
    .wreath .names{position:relative;font-size:clamp(2.2rem,10vw,3.2rem);line-height:1.5}
    .wreath .amp{display:block;color:var(--gold);font-size:1.6rem}
    .corner{position:absolute;width:150px;height:150px;pointer-events:none}
    .corner.tl{top:0;left:0}.corner.tr{top:0;right:0;transform:scaleX(-1)}
    .corner.bl{bottom:0;left:0;transform:scaleY(-1)}.corner.br{right:0;bottom:0;transform:scale(-1)}
    .dateblock{display:inline-flex;flex-direction:column;align-items:center;margin:18px 0;padding:18px 34px;border:1px solid var(--gold);border-radius:2px}
    .dateblock b{color:var(--gold);font-size:3.6rem;line-height:1}
    .btn{display:inline-block;margin:6px;padding:10px 22px;border:1px solid var(--gold);border-radius:999px;background:transparent;color:var(--gold);font:inherit;text-decoration:none;cursor:pointer}
    .btn.fill{background:var(--gold);color:#fff;font-weight:700}
    .verse{font-size:1.35rem;line-height:2.2}
    .hrow{display:flex;gap:8px;margin:18px 0}
    .hrow>div{display:flex;flex:1;flex-direction:column;align-items:center;gap:2px;padding:0 6px;border-left:1px solid var(--line)}
    .hrow>div:last-child{border:0}.ic{font-size:1.6rem}
    .priv{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:.95rem}
    .nos{display:flex;justify-content:center;gap:18px;margin-top:10px}
    .nos svg{width:64px;height:64px}
    .cd{display:flex;justify-content:center;gap:10px;margin:18px 0}
    .cd div{flex:1;max-width:96px;padding:12px 4px;border:1px solid var(--line);background:var(--card);text-align:center}
    .cd b{display:block;font-size:1.8rem;line-height:1.2;font-variant-numeric:tabular-nums}
    .cards{font-size:1.15rem}
    .cards .nm{color:var(--gold);font-size:1.5rem}
    #katb img{max-width:100%;margin:12px 0;border:1px solid var(--line)}
    #snd{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;width:46px;height:46px;border:1px solid var(--gold);border-radius:50%;background:#fff;color:var(--gold);font-size:1.2rem;cursor:pointer}
    #snd:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
    #cover{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:24px;background:transparent;color:#f6f1e4;text-align:center;cursor:pointer}
    #cover .cur{position:absolute;top:0;bottom:0;width:50.5%;border-color:rgba(0,0,0,.4);border-style:solid;background:repeating-linear-gradient(90deg,#17301a 0,#2f5a2c 26px,#17301a 56px);box-shadow:inset 0 0 70px rgba(0,0,0,.6);transition:transform 2.8s cubic-bezier(.65,0,.25,1)}
    #cover .cur.l{left:0;border-width:0 2px 0 0}#cover .cur.r{right:0;border-width:0 0 0 2px}
    #cover .val{position:absolute;top:0;right:0;left:0;z-index:3;height:44px;background:linear-gradient(#f0c9ae,#a8704f);box-shadow:0 6px 18px rgba(0,0,0,.5);transition:transform 1.2s ease 1.8s}
    #cover .stage{position:relative;z-index:2;text-shadow:0 2px 14px rgba(0,0,0,.6);transition:opacity .6s}
    #cover .names{font:700 clamp(2.4rem,11vw,3.8rem)/1.5 "Aref Ruqaa","Amiri",serif}
    #cover .tap{display:inline-block;margin-top:28px;padding:10px 26px;border:1px solid #ecd9a6;border-radius:999px;color:#ecd9a6;animation:pulse 2.2s infinite}
    #cover.open .cur.l{transform:translateX(-101%)}#cover.open .cur.r{transform:translateX(101%)}
    #cover.open .val{transform:translateY(-110%)}#cover.open .stage{opacity:0}
    #cover.open{pointer-events:none}
    #cover.gone{display:none}
    @keyframes pulse{50%{opacity:.45}}
    @media(prefers-reduced-motion:reduce){#cover .cur,#cover .val,#cover .stage{transition:none}#cover .tap{animation:none}}
    @media print{#cover,#snd{display:none!important}}
  </style>
</head>
<body>
  <button id="cover" type="button" aria-label="افتح الدعوة">
    <span class="cur l" aria-hidden="true"></span><span class="cur r" aria-hidden="true"></span><span class="val" aria-hidden="true"></span>
    <span class="stage">
      <span class="mute cover-title">دعوة زفاف</span>
      <span class="names"><span id="coverGroom"></span><br><span style="color:var(--gold)">♥</span><br><span id="coverBride"></span></span>
      <span class="tap">اضغط لفتح الدعوة</span>
    </span>
  </button>
  <audio id="backgroundMusic" preload="auto" loop hidden></audio>
  <main>
    <section class="hero">
      <svg class="corner tl" viewBox="0 0 150 150" aria-hidden="true"></svg>
      <svg class="corner tr" viewBox="0 0 150 150" aria-hidden="true"></svg>
      <svg class="corner bl" viewBox="0 0 150 150" aria-hidden="true"></svg>
      <svg class="corner br" viewBox="0 0 150 150" aria-hidden="true"></svg>
      <p class="poem" id="poem"></p>
      <div class="wreath">
        <svg id="wreath" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
        <div class="names"><span id="groom"></span><span class="amp">&amp;</span><span id="bride"></span></div>
      </div>
      <div class="date-big" id="heroDate"></div>
    </section>
    <section id="verseSec">
      <p class="verse" id="basmala">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
      <p class="verse" id="verse"></p>
      <p class="mute" id="verseRef"></p>
    </section>
    <section id="mainInviteSection">
      <h2 id="heading"></h2>
      <p id="invite"></p>
      <p style="font-size:1.25rem"><b id="inviteNames"></b></p>
      <div class="dateblock">
        <span id="dWeek"></span><b id="dDay"></b><span id="dMonth"></span>
        <span id="dYear" class="mute"></span><span id="dTime" style="color:var(--gold)"></span>
      </div>
      <a class="btn" id="calBtn" target="_blank" rel="noopener">ضيفه للتقويم</a>
    </section>
    <section id="hennaSec">
      <h2>ليلة حنة</h2>
      <div class="script" id="hennaBride" style="font-size:3.4rem;line-height:1.3"></div>
      <p class="poem" id="hennaVerse" style="margin:10px auto"></p>
      <div class="hrow">
        <div><span class="ic">📅</span><span id="hDate"></span></div>
        <div><span class="ic">🕖</span><span id="hTime"></span></div>
        <div><span class="ic">📍</span><span id="hennaPlace"></span><b id="hennaNote"></b></div>
      </div>
      <div id="privacy" class="priv">
        <p id="privacyText"></p>
        <div class="nos" aria-hidden="true">
          <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="none" stroke="#c4546b" stroke-width="5"/><text x="32" y="42" font-size="28" text-anchor="middle">📱</text><line x1="14" y1="14" x2="50" y2="50" stroke="#c4546b" stroke-width="5"/></svg>
          <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="none" stroke="#c4546b" stroke-width="5"/><text x="32" y="42" font-size="28" text-anchor="middle">📷</text><line x1="14" y1="14" x2="50" y2="50" stroke="#c4546b" stroke-width="5"/></svg>
        </div>
      </div>
    </section>
    <section id="lunchSec">
      <h2 id="lunchTitle"></h2><p id="lunchDate"></p><p id="lunchPlace"></p><p id="lunchTime" class="mute"></p>
    </section>
    <section>
      <h2>بنعد اللحظات</h2>
      <div class="cd" aria-live="off">
        <div><b id="cdD">٠٠</b>يوم</div><div><b id="cdH">٠٠</b>ساعة</div>
        <div><b id="cdM">٠٠</b>دقيقة</div><div><b id="cdS">٠٠</b>ثانية</div>
      </div>
      <p class="mute" id="cdNote"></p>
    </section>
    <section>
      <h2>مكان الحفل</h2>
      <p id="venue" style="font-size:1.3rem"></p>
      <p id="venueAddr" class="mute"></p>
      <a class="btn fill" id="mapBtn" target="_blank" rel="noopener noreferrer">الوصول للقاعة</a>
    </section>
    <section id="katb">
      <h2>كتبنا كتابنا</h2>
      <img id="katbImg" alt="وثيقة عقد القران" class="hidden">
      <p id="katbText" class="mute"></p>
    </section>
    <section class="cards" id="cardsSec">
      <p>يتشرف الأستاذ/ <span class="nm" id="groomFather"></span></p>
      <p>والأستاذ/ <span class="nm" id="brideFather"></span></p>
      <p id="parentsInviteText"></p>
      <p>نجل الأول <b id="groomFull"></b></p>
      <p>وكريمة الثاني <b id="brideFull"></b></p>
      <p class="script" style="font-size:2rem;color:var(--gold);margin-top:24px"><span id="footerGroom"></span> &amp; <span id="footerBride"></span></p>
      <p id="footDate" class="mute"></p>
      <p id="closing"></p>
    </section>
  </main>
  <button id="snd" type="button" aria-label="كتم / تشغيل الصوت" aria-pressed="false">🔊</button>
  <script src="./guest.js?v=attached-wedding-only"></script>
</body>
</html>
